    <!-- blue handle -->
    <rect x="1" y="40" width="7.5" height="31" rx="3.75" fill="#004f94" stroke="#003a6e" stroke-width="1"/>
    <rect x="2.8" y="44" width="1.6" height="16" rx=".8" fill="#fff" opacity=".35"/>
