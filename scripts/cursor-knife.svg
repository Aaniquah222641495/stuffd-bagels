<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d3d9e0"/><stop offset="1" stop-color="#a3adb8"/>
    </linearGradient>
  </defs>
  <g transform="translate(6 6) rotate(-45) translate(-4.5 0)">
    <g fill="#fff" stroke="#fff" stroke-width="4.5" stroke-linejoin="round">
      <path d="M4.5 0 C7.8 0 9 4 9 9 L9 40 L1.5 40 C0.6 30 0 18 0 9 C0 3.5 1.5 0 4.5 0 Z"/>
      <rect x="1" y="40" width="7.5" height="31" rx="3.75"/>
