name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm (same version as the lockfile was made with)
        run: npm install -g pnpm@10.34.7 && pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build the website (with prerender)
        run: pnpm --filter @workspace/stuffd-bagels run build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /
      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high
        continue-on-error: true
